[build]
  publish = "site"
  command = ""

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/masterclass"
  to = "/webinar/"
  status = 301

[[redirects]]
  from = "/masterclass/*"
  to = "/webinar/:splat"
  status = 301

[[redirects]]
  from = "/webinar"
  to = "/webinar/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8080
  publish = "dist"
