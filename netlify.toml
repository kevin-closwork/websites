[build]
  publish = "site"
  # El HTML ya está en site/. Este comando solo abre el build para empaquetar la function.
  command = "echo static"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/masterclass"
  to = "/webinar/"
  status = 301

[[redirects]]
  from = "/masterclass/*"
  to = "/webinar/:splat"
  status = 301

[[redirects]]
  from = "/webinar"
  to = "/webinar/"
  status = 301

[[redirects]]
  from = "/api/webinar-lead"
  to = "/.netlify/functions/webinar-lead"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8080
  publish = "dist"
